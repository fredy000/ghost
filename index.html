<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טלפרומפטר חכם</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
    }

    /* 1. מסך בחירת מצב */
    #modeSelector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      padding: 20px;
    }
    .mode-btn {
      width: 100%;
      max-width: 300px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #00e676;
      color: #000;
    }
    .mode-btn.display-mode {
      background: #29b6f6;
    }

    /* 2. עיצוב השלט */
    #controllerView {
      display: none;
      padding: 20px;
      flex-direction: column;
      gap: 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .control-group {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-btn {
      background: #00e676;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
    .action-btn.pause { background: #ff3d00; color: #fff; }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
    }

    /* 3. עיצוב תצוגת הפרומפטר */
    #displayView {
      display: none;
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #viewport {
      height: 100vh;
      overflow-y: scroll;
      padding: 40vh 5vw;
      scrollbar-width: none;
    }
    #viewport::-webkit-scrollbar { display: none; }
    #prompterContent {
      font-weight: bold;
      line-height: 1.5;
      white-space: pre-wrap;
      text-align: right;
    }
    .mirrored { transform: scaleX(-1); }
    
    .back-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      z-index: 100;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- מסך בחירת תפקיד -->
  <div id="modeSelector">
    <h2>מה המכשיר הזה עושה?</h2>
    <button class="mode-btn" id="selectController">📱 הפעל כשלט</button>
    <button class="mode-btn display-mode" id="selectDisplay">📺 הפעל כמסך פרומפטר</button>
  </div>

  <!-- תצוגת השלט -->
  <div id="controllerView">
    <button class="back-btn" onclick="location.reload()">↺ חזור לבחירה</button>
    <h2 style="text-align:center; color:#00e676;">שלט טלפרומפטר</h2>
    
    <textarea id="textInput" placeholder="הכנס כאן את הטקסט למקרא..."></textarea>
    <button class="action-btn" id="playBtn">נגן / הראה</button>

    <div class="controls-grid">
      <div class="control-group">
        <label>מהירות (<span id="speedVal">3</span>)</label>
        <input type="range" id="speedInput" min="1" max="10" value="3">
      </div>
      <div class="control-group">
        <label>פונט (<span id="fontVal">48</span>px)</label>
        <input type="range" id="fontInput" min="20" max="100" value="48">
      </div>
    </div>

    <div class="toggle-group">
      <span>מצב מראה (Flip)</span>
      <input type="checkbox" id="mirrorToggle">
    </div>

    <button class="action-btn" id="resetBtn" style="background:#333; color:#fff;">חזור להתחלה</button>
  </div>

  <!-- תצוגת הפרומפטר -->
  <div id="displayView">
    <button class="back-btn" onclick="location.reload()">↺ חזור</button>
    <div id="viewport">
      <div id="prompterContent">ממתין לטקסט מהשלט...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ה-Firebase Config האמיתי שלך
    const firebaseConfig = {
      apiKey: "AIzaSyA-gi3EIwLFcNS6MN6RGqs3L5UQsxTAbzk",
      authDomain: "ghost-a424e.firebaseapp.com",
      databaseURL: "https://ghost-a424e-default-rtdb.firebaseio.com",
      projectId: "ghost-a424e",
      storageBucket: "ghost-a424e.firebasestorage.app",
      messagingSenderId: "449116961300",
      appId: "1:449116961300:web:e3b20392eb17101e4cc501",
      measurementId: "G-8B1FZQT6FF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const prompterRef = ref(db, 'prompter');

    const modeSelector = document.getElementById('modeSelector');
    const controllerView = document.getElementById('controllerView');
    const displayView = document.getElementById('displayView');

    // ------------------- ניווט בין מצבים -------------------
    document.getElementById('selectController').addEventListener('click', () => startController());
    document.getElementById('selectDisplay').addEventListener('click', () => startDisplay());

    // בדיקה אם עברו דרך URL (למשל: index.html?mode=display)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'display') startDisplay();
    if (urlParams.get('mode') === 'controller') startController();

    // ------------------- לוגיקת שלט -------------------
    function startController() {
      modeSelector.style.display = 'none';
      controllerView.style.display = 'flex';

      let state = { text: "", isPlaying: false, speed: 3, fontSize: 48, isMirrored: false, resetScroll: false };
      const sync = () => update(prompterRef, state);

      document.getElementById('textInput').addEventListener('input', (e) => { state.text = e.target.value; sync(); });
      
      const playBtn = document.getElementById('playBtn');
      playBtn.addEventListener('click', () => {
        state.isPlaying = !state.isPlaying;
        playBtn.textContent = state.isPlaying ? "השהה" : "נגן";
        playBtn.className = state.isPlaying ? "action-btn pause" : "action-btn";
        sync();
      });

      document.getElementById('speedInput').addEventListener('input', (e) => {
        state.speed = parseInt(e.target.value);
        document.getElementById('speedVal').textContent = state.speed;
        sync();
      });

      document.getElementById('fontInput').addEventListener('input', (e) => {
        state.fontSize = parseInt(e.target.value);
        document.getElementById('fontVal').textContent = state.fontSize;
        sync();
      });

      document.getElementById('mirrorToggle').addEventListener('change', (e) => {
        state.isMirrored = e.target.checked;
        sync();
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        state.resetScroll = true; sync();
        setTimeout(() => { state.resetScroll = false; sync(); }, 200);
      });
    }

    // ------------------- לוגיקת מסך -------------------
    function startDisplay() {
      modeSelector.style.display = 'none';
      displayView.style.display = 'block';

      const viewport = document.getElementById('viewport');
      const content = document.getElementById('prompterContent');
      let currentSpeed = 3;
      let isPlaying = false;
      let scrollInterval = null;

      onValue(prompterRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.text !== undefined && content.innerText !== data.text) {
          content.innerText = data.text || "ממתין לטקסט...";
        }
        if (data.fontSize) content.style.fontSize = `${data.fontSize}px`;
        if (data.isMirrored !== undefined) {
          data.isMirrored ? viewport.classList.add('mirrored') : viewport.classList.remove('mirrored');
        }
        if (data.resetScroll) viewport.scrollTop = 0;

        currentSpeed = data.speed || 3;
        isPlaying = !!data.isPlaying;

        // מנגנון גלילה
        if (scrollInterval) clearInterval(scrollInterval);
        if (isPlaying) {
          scrollInterval = setInterval(() => { viewport.scrollTop += (currentSpeed / 2); }, 16);
        }
      });
    }
  </script>
</body>
</html>
