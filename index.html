<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טלפרומפטר חכם</title>
  <!-- טעינת גופנים מ-Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;800&family=Heebo:wght@700;900&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
    }

    /* 1. מסך בחירת מצב */
    #modeSelector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      padding: 20px;
    }
    .mode-btn {
      width: 100%;
      max-width: 300px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #00e676;
      color: #000;
    }
    .mode-btn.display-mode {
      background: #29b6f6;
    }

    /* 2. עיצוב השלט */
    #controllerView {
      display: none;
      padding: 20px;
      flex-direction: column;
      gap: 15px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    
    /* קופסת ניהול תסריטים */
    .library-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .library-card h4 { color: #00e676; font-size: 14px; }
    .library-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .control-group {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-btn {
      background: #00e676;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
    .action-btn.pause { background: #ff3d00; color: #fff; }
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
    }
    select {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 6px;
      font-size: 15px;
      flex: 1;
    }
    .btn-group-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .sub-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .sub-btn.active {
      background: #00e676;
      color: #000;
      border-color: #00e676;
    }
    .sub-btn.danger {
      background: #d32f2f;
      color: #fff;
      border-color: #d32f2f;
    }

    /* 3. עיצוב תצוגת הפרומפטר */
    #displayView {
      display: none;
      background-color: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #viewport {
      height: 100vh;
      overflow-y: scroll;
      padding: 40vh 5vw;
      scrollbar-width: none;
    }
    #viewport::-webkit-scrollbar { display: none; }
    #prompterContent {
      font-weight: 800;
      line-height: 1.5;
      white-space: pre-wrap;
      text-align: right;
      font-family: 'Rubik', sans-serif;
    }
    .mirrored { transform: scaleX(-1); }
    
    .back-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      z-index: 100;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- מסך בחירת תפקיד -->
  <div id="modeSelector">
    <h2>מה המכשיר הזה עושה?</h2>
    <button class="mode-btn" id="selectController">📱 הפעל כשלט</button>
    <button class="mode-btn display-mode" id="selectDisplay">📺 הפעל כמסך פרומפטר</button>
  </div>

  <!-- תצוגת השלט -->
  <div id="controllerView">
    <button class="back-btn" onclick="location.reload()">↺ חזור לבחירה</button>
    <h2 style="text-align:center; color:#00e676;">שלט טלפרומפטר</h2>
    
    <!-- ספריית תסריטים שמורים ב-Firebase -->
    <div class="library-card">
      <h4>📂 ספריית תסריטים שמורים (מסונכרן בענן)</h4>
      <div class="library-row">
        <select id="savedScriptsSelect">
          <option value="">-- בחר תסריט שמור --</option>
        </select>
        <button class="sub-btn danger" id="deleteScriptBtn">🗑️ מחק</button>
      </div>
      <div class="library-row">
        <input type="text" id="scriptTitleInput" placeholder="שם לתסריט החדש (למשל: סרטון 1)">
        <button class="sub-btn" id="saveScriptBtn" style="background: #00e676; color: #000;">💾 שמור בענן</button>
      </div>
    </div>

    <textarea id="textInput" placeholder="הכנס כאן את הטקסט למקרא..."></textarea>
    <button class="action-btn" id="playBtn">נגן / הראה</button>

    <!-- שליטה בגלילה -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <button class="sub-btn" id="stepBackBtn">↩ קפוץ אחורה</button>
      <button class="sub-btn" id="resetBtn">⏮ חזור להתחלה</button>
    </div>

    <!-- הגדרות טיפוגרפיה -->
    <div class="controls-grid">
      <div class="control-group">
        <label>גופן (Font)</label>
        <select id="fontFamilyInput">
          <option value="'Rubik', sans-serif">Rubik</option>
          <option value="'Heebo', sans-serif">Heebo</option>
          <option value="'Assistant', sans-serif">Assistant</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="monospace">Monospace</option>
        </select>
      </div>

      <div class="control-group">
        <label>יישור טקסט</label>
        <div class="btn-group-3">
          <button class="sub-btn active" id="alignRight">ימין</button>
          <button class="sub-btn" id="alignCenter">מרכז</button>
          <button class="sub-btn" id="alignLeft">שמאל</button>
        </div>
      </div>
    </div>

    <div class="controls-grid">
      <div class="control-group">
        <label>מהירות (<span id="speedVal">3</span>)</label>
        <input type="range" id="speedInput" min="1" max="10" value="3">
      </div>
      <div class="control-group">
        <label>גודל פונט (<span id="fontVal">48</span>px)</label>
        <input type="range" id="fontInput" min="20" max="100" value="48">
      </div>
    </div>

    <div class="toggle-group">
      <span>מצב מראה (Flip)</span>
      <input type="checkbox" id="mirrorToggle">
    </div>
  </div>

  <!-- תצוגת הפרומפטר -->
  <div id="displayView">
    <button class="back-btn" onclick="location.reload()">↺ חזור</button>
    <div id="viewport">
      <div id="prompterContent">ממתין לטקסט מהשלט...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, update, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA-gi3EIwLFcNS6MN6RGqs3L5UQsxTAbzk",
      authDomain: "ghost-a424e.firebaseapp.com",
      databaseURL: "https://ghost-a424e-default-rtdb.firebaseio.com",
      projectId: "ghost-a424e",
      storageBucket: "ghost-a424e.firebasestorage.app",
      messagingSenderId: "449116961300",
      appId: "1:449116961300:web:e3b20392eb17101e4cc501",
      measurementId: "G-8B1FZQT6FF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const prompterRef = ref(db, 'prompter');
    const scriptsRef = ref(db, 'saved_scripts');

    const modeSelector = document.getElementById('modeSelector');
    const controllerView = document.getElementById('controllerView');
    const displayView = document.getElementById('displayView');

    // ------------------- ניווט בין מצבים -------------------
    document.getElementById('selectController').addEventListener('click', () => startController());
    document.getElementById('selectDisplay').addEventListener('click', () => startDisplay());

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'display') startDisplay();
    if (urlParams.get('mode') === 'controller') startController();

    // ------------------- לוגיקת שלט -------------------
    function startController() {
      modeSelector.style.display = 'none';
      controllerView.style.display = 'flex';

      let state = { 
        text: "", 
        isPlaying: false, 
        speed: 3, 
        fontSize: 48, 
        fontFamily: "'Rubik', sans-serif",
        textAlign: "right",
        isMirrored: false, 
        resetScroll: false,
        stepBack: false
      };

      let loadedScripts = {};

      const sync = () => update(prompterRef, state);

      const textInput = document.getElementById('textInput');
      textInput.addEventListener('input', (e) => { state.text = e.target.value; sync(); });

      // --- ניהול תסריטים שמורים בענן (Firebase Realtime Database) ---
      const savedSelect = document.getElementById('savedScriptsSelect');
      const titleInput = document.getElementById('scriptTitleInput');

      // האזנה לכל התסריטים השמורים ב-Firebase (מעדכן את הרשימה בכל הטלפונים בלייב!)
      onValue(scriptsRef, (snapshot) => {
        loadedScripts = snapshot.val() || {};
        const currentVal = savedSelect.value;
        savedSelect.innerHTML = '<option value="">-- בחר תסריט שמור --</option>';
        
        Object.keys(loadedScripts).forEach(key => {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = loadedScripts[key].title || key;
          savedSelect.appendChild(opt);
        });

        if (loadedScripts[currentVal]) {
          savedSelect.value = currentVal;
        }
      });

      // שמירת תסריט ב-Firebase
      document.getElementById('saveScriptBtn').addEventListener('click', () => {
        const title = titleInput.value.trim();
        const content = textInput.value;
        if (!title) { alert('אנא הכנס שם לתסריט'); return; }
        if (!content) { alert('אין טקסט לשמירה'); return; }

        // יצירת מפתח נקי מתווים מיוחדים
        const safeKey = title.replace(/[.#$/[\]]/g, "_");

        set(ref(db, `saved_scripts/${safeKey}`), {
          title: title,
          content: content
        }).then(() => {
          titleInput.value = '';
          savedSelect.value = safeKey;
          alert(`התסריט "${title}" נשמר בענן וזמין מכל מכשיר!`);
        });
      });

      // טעינת תסריט שנבחר מהרשימה
      savedSelect.addEventListener('change', (e) => {
        const key = e.target.value;
        if (!key || !loadedScripts[key]) return;

        const scriptContent = loadedScripts[key].content;
        textInput.value = scriptContent;
        state.text = scriptContent;
        sync();
      });

      // מחיקת תסריט מ-Firebase
      document.getElementById('deleteScriptBtn').addEventListener('click', () => {
        const key = savedSelect.value;
        if (!key) { alert('אנא בחר תסריט למחיקה'); return; }
        const scriptName = loadedScripts[key] ? loadedScripts[key].title : key;

        if (confirm(`להמשיך ולמחוק את התסריט "${scriptName}" מהענן?`)) {
          remove(ref(db, `saved_scripts/${key}`));
        }
      });

      // --- שאר הפקודות בשלט ---
      const playBtn = document.getElementById('playBtn');
      playBtn.addEventListener('click', () => {
        state.isPlaying = !state.isPlaying;
        playBtn.textContent = state.isPlaying ? "השהה" : "נגן";
        playBtn.className = state.isPlaying ? "action-btn pause" : "action-btn";
        sync();
      });

      document.getElementById('speedInput').addEventListener('input', (e) => {
        state.speed = parseInt(e.target.value);
        document.getElementById('speedVal').textContent = state.speed;
        sync();
      });

      document.getElementById('fontInput').addEventListener('input', (e) => {
        state.fontSize = parseInt(e.target.value);
        document.getElementById('fontVal').textContent = state.fontSize;
        sync();
      });

      document.getElementById('fontFamilyInput').addEventListener('change', (e) => {
        state.fontFamily = e.target.value;
        sync();
      });

      const setAlign = (align, btnId) => {
        state.textAlign = align;
        ['alignRight', 'alignCenter', 'alignLeft'].forEach(id => {
          document.getElementById(id).classList.toggle('active', id === btnId);
        });
        sync();
      };

      document.getElementById('alignRight').addEventListener('click', () => setAlign('right', 'alignRight'));
      document.getElementById('alignCenter').addEventListener('click', () => setAlign('center', 'alignCenter'));
      document.getElementById('alignLeft').addEventListener('click', () => setAlign('left', 'alignLeft'));

      document.getElementById('mirrorToggle').addEventListener('change', (e) => {
        state.isMirrored = e.target.checked;
        sync();
      });

      document.getElementById('stepBackBtn').addEventListener('click', () => {
        state.stepBack = true; sync();
        setTimeout(() => { state.stepBack = false; sync(); }, 150);
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        state.resetScroll = true; sync();
        setTimeout(() => { state.resetScroll = false; sync(); }, 150);
      });
    }

    // ------------------- לוגיקת מסך -------------------
    function startDisplay() {
      modeSelector.style.display = 'none';
      displayView.style.display = 'block';

      const viewport = document.getElementById('viewport');
      const content = document.getElementById('prompterContent');
      let currentSpeed = 3;
      let isPlaying = false;
      let scrollInterval = null;

      onValue(prompterRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.text !== undefined && content.innerText !== data.text) {
          content.innerText = data.text || "ממתין לטקסט...";
        }
        if (data.fontSize) content.style.fontSize = `${data.fontSize}px`;
        if (data.fontFamily) content.style.fontFamily = data.fontFamily;
        if (data.textAlign) content.style.textAlign = data.textAlign;

        if (data.isMirrored !== undefined) {
          data.isMirrored ? viewport.classList.add('mirrored') : viewport.classList.remove('mirrored');
        }

        if (data.resetScroll) viewport.scrollTop = 0;

        if (data.stepBack) {
          const jumpAmount = (data.fontSize || 48) * 3;
          viewport.scrollTop = Math.max(0, viewport.scrollTop - jumpAmount);
        }

        currentSpeed = data.speed || 3;
        isPlaying = !!data.isPlaying;

        if (scrollInterval) clearInterval(scrollInterval);
        if (isPlaying) {
          scrollInterval = setInterval(() => { viewport.scrollTop += (currentSpeed / 2); }, 16);
        }
      });
    }
  </script>
</body>
</html>
